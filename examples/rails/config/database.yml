default: &default
  adapter: sqlite3
  pool: 5
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
<% if ENV["TEST_DATABASE_URL"].to_s != "" %>
  adapter: postgresql
  url: <%= ENV["TEST_DATABASE_URL"] %>
<% else %>
  <<: *default
  database: ":memory:"
<% end %>

production:
  adapter: postgresql
  url: <%= ENV["DATABASE_URL"] %>
  pool: 12
